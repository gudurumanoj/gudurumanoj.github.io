# TOML rule: plain `key = value` lines must come BEFORE the first [section] header.
# Anything written after a header belongs to that section.

# ---------------------------------------------------------------------------
# Generic Hugo params most themes understand.
# ---------------------------------------------------------------------------
description = "man'log: Manoj Guduru's notes on ML, math, and competitive programming."
mainSections = ["blog"]
env = "production"

# ---------------------------------------------------------------------------
# PaperMod-specific params. Other themes ignore these keys.
# ---------------------------------------------------------------------------
defaultTheme = "light"
disableThemeToggle = true
ShowReadingTime = true
ShowCodeCopyButtons = false   # code panels have their own copy button (layouts/_markup/render-codeblock.html)
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowWordCount = false
ShowToc = false
hideFooter = false

[assets]
  favicon = "favicon.ico"
  favicon16x16 = "favicon-16x16.png"
  favicon32x32 = "favicon-32x32.png"
  apple_touch_icon = "apple-touch-icon.png"
  safari_pinned_tab = "favicon.svg"
  theme_color = "#f3f0e8"

[label]
  text = "man'log"
  icon = "favicon.svg"
  iconHeight = 24

# ---------------------------------------------------------------------------
# man'log settings: read by our own templates in layouts/, independent of the theme.
# ---------------------------------------------------------------------------
[manlog]
  name = "Manoj Guduru"
  # One line under your name on the landing page. Empty hides it.
  tagline = "AI Research · Fractal"
  # Add resources/profile/photo.jpg; the asset mount makes it available at this path.
  # A missing file shows a placeholder. Hugo crops the photo to a square for display.
  avatar = "profile/photo.jpg"
  # The right-side table-of-contents rail appears on posts with at least this many h2/h3 headings.
  tocMinHeadings = 3
  # Ctrl/Cmd+K search dialog on every page (needs the Pagefind index, see README.md).
  searchModal = true
  # Loaded only on pages that use them.
  # katexCSS must match the KaTeX version bundled in Hugo (0.18.4 as of Hugo v0.166-0.167);
  # check Hugo's release notes when bumping HUGO_VERSION in .github/workflows/hugo.yml.
  katexCSS = "https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css"
  mermaidJS = "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"

  # Social links on the landing page. Icons available: github, x, linkedin, email, scholar, rss, link
  # Keep these [[manlog.socials]] blocks at the end of the file.
  [[manlog.socials]]
    name = "GitHub"
    url = "https://github.com/gudurumanoj"
    icon = "github"
  [[manlog.socials]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/guduru-manoj-49957a222/"
    icon = "linkedin"
  [[manlog.socials]]
    name = "Scholar"
    url = "https://scholar.google.com/citations?user=4pEzB7EAAAAJ&hl=en"
    icon = "scholar"
  [[manlog.socials]]
    name = "Email"
    url = "mailto:gudurumanoj271102@gmail.com"
    icon = "email"
