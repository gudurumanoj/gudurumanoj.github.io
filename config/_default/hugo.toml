# Site-wide settings. To switch the look of the whole site, change `theme`
# to another folder under themes/ (see README.md -> "Swapping the theme").
baseURL = "https://gudurumanoj.github.io/"
locale = "en-US"
title = "man'log"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
summaryLength = 40
# Keep tag names exactly as written in front matter (no auto Title Case).
capitalizeListTitles = false

[pagination]
  pagerSize = 12

[taxonomies]
  tag = "tags"

# Only Markdown files are pages. Anything else in a post folder (demo.html, images,
# GIFs, videos) is a plain file served next to the post.
[contentTypes]
  [contentTypes.'text/markdown']

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark.renderer]
    # Allows raw HTML in posts (<details>, <iframe>, custom markup).
    unsafe = true

  # LaTeX: everything between these delimiters is handed to
  # layouts/_markup/render-passthrough.html and rendered with KaTeX at build time.
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
