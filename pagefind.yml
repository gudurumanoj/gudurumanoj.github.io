# Search index settings, read by `pagefind --site public`.
# Only posts are indexed; listing pages (blog/, tags) opt out with data-pagefind-ignore.
site: public
glob: "blog/**/index.html"
exclude_selectors:
  - ".ml-toc"
  - ".post-footer"
  - ".post-meta"
  - ".breadcrumbs"
  - ".paginav"
  - ".copy-code"
  - ".ml-code-head"
  - "pre.mermaid"
  - ".katex"
  - ".anchor"
