<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuffle the sentence: attention without positions</title>
<style>
  :root {
    --bg: #fdfcf8; --text: #2d2a23; --muted: #7a7266; --accent: #a66b4f;
    --line: #e6e0d4; --card: #f6f2ea; --neg: #4f7aa6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 12px; }
  button {
    font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--bg); color: var(--accent);
  }
  button:hover { background: var(--accent); color: #fff; }
  label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  input[type=checkbox] { accent-color: var(--accent); }
  .tokens { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 4px; }
  .chip {
    font-family: ui-monospace, Menlo, monospace; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); cursor: pointer;
  }
  .chip.picked { border-color: var(--accent); background: #f3e3d8; }
  .chip sub { color: var(--muted); }
  .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
  .panels { display: grid; grid-template-columns: 1fr 1.25fr; gap: 18px; }
  @media (max-width: 680px) { .panels { grid-template-columns: 1fr; } }
  h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  table { border-collapse: collapse; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  th { font-weight: 500; color: var(--muted); padding: 2px 4px; white-space: nowrap; }
  td.w { width: 38px; height: 26px; text-align: center; border: 1px solid var(--bg); }
  td.v { width: 22px; height: 22px; border: 1px solid var(--bg); }
  td.delta { padding-left: 10px; text-align: right; white-space: nowrap; }
  .zero { color: #4b7a4f; }
  .nonzero { color: var(--accent); font-weight: 600; }
  .status {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--card);
    border-left: 3px solid var(--accent);
  }
</style>
</head>
<body>
<div class="controls">
  <button id="shuffle">Shuffle words</button>
  <button id="reset">Reset order</button>
  <label><input type="checkbox" id="pe"> add positional encoding</label>
  <label><input type="checkbox" id="causal"> causal mask</label>
</div>
<div class="tokens" id="tokens"></div>
<div class="hint">Click two words to swap them. Subscripts tell the two copies of "the" apart.</div>

<div class="panels">
  <div>
    <h3>Attention weights (row = query, column = key)</h3>
    <table id="attn"></table>
  </div>
  <div>
    <h3>Attention output per token</h3>
    <table id="out"></table>
  </div>
</div>
<div class="status" id="status"></div>

<script>
const WORDS = ["the", "cat", "sat", "on", "the", "mat"];
const D = 8;

// Deterministic random numbers so the page looks the same on every load.
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(7);
const gauss = () => Math.sqrt(-2 * Math.log(rand() + 1e-12)) * Math.cos(2 * Math.PI * rand());
const matrix = (r, c, s = 1) => Array.from({ length: r }, () => Array.from({ length: c }, () => gauss() * s));

const vocab = [...new Set(WORDS)];
const EMB = Object.fromEntries(vocab.map((w) => [w, matrix(1, D)[0]]));
const WQ = matrix(D, D, 1.6 / Math.sqrt(D));
const WK = matrix(D, D, 1.6 / Math.sqrt(D));
const WV = matrix(D, D, 1 / Math.sqrt(D));

const matvec = (v, W) => W[0].map((_, j) => v.reduce((s, vi, i) => s + vi * W[i][j], 0));
const dot = (a, b) => a.reduce((s, ai, i) => s + ai * b[i], 0);
const dist = (a, b) => Math.sqrt(a.reduce((s, ai, i) => s + (ai - b[i]) ** 2, 0));

function sinusoid(pos) {
  return Array.from({ length: D }, (_, k) => {
    const i = Math.floor(k / 2);
    const angle = pos / Math.pow(10000, (2 * i) / D);
    return k % 2 === 0 ? Math.sin(angle) : Math.cos(angle);
  });
}

// tokens: [{word, id}] where id is the token's index in the original sentence
function attend(tokens, usePE, causal) {
  const X = tokens.map((t, pos) => {
    const e = EMB[t.word];
    return usePE ? e.map((x, k) => x + sinusoid(pos)[k]) : e.slice();
  });
  const Q = X.map((x) => matvec(x, WQ));
  const K = X.map((x) => matvec(x, WK));
  const V = X.map((x) => matvec(x, WV));
  const A = Q.map((q, i) => {
    const s = K.map((k, j) => (causal && j > i ? -Infinity : dot(q, k) / Math.sqrt(D)));
    const m = Math.max(...s);
    const e = s.map((x) => Math.exp(x - m));
    const z = e.reduce((a, b) => a + b, 0);
    return e.map((x) => x / z);
  });
  const O = A.map((row) => Array.from({ length: D }, (_, k) => row.reduce((s, a, j) => s + a * V[j][k], 0)));
  return { A, O };
}

const original = WORDS.map((word, id) => ({ word, id }));
let order = original.slice();
let picked = null;

const subscript = (t) => {
  const copies = original.filter((o) => o.word === t.word);
  return copies.length > 1 ? `<sub>${copies.indexOf(original[t.id]) + 1}</sub>` : "";
};
const label = (t) => `${t.word}${subscript(t)}`;

function weightColor(w) {
  const a = Math.min(1, w * 1.4);
  return `rgba(166,107,79,${a.toFixed(3)})`;
}
function valueColor(v, max) {
  const a = Math.min(1, Math.abs(v) / max);
  return v >= 0 ? `rgba(166,107,79,${a.toFixed(3)})` : `rgba(79,122,166,${a.toFixed(3)})`;
}

function render() {
  const usePE = document.getElementById("pe").checked;
  const causal = document.getElementById("causal").checked;
  const now = attend(order, usePE, causal);
  const ref = attend(original, usePE, causal);

  document.getElementById("tokens").innerHTML = order
    .map((t, i) => `<span class="chip${picked === i ? " picked" : ""}" data-i="${i}">${label(t)}</span>`)
    .join("");

  let html = "<tr><th></th>" + order.map((t) => `<th>${label(t)}</th>`).join("") + "</tr>";
  now.A.forEach((row, i) => {
    html += `<tr><th>${label(order[i])}</th>` + row.map((w) => {
      const dark = w > 0.45;
      return `<td class="w" style="background:${weightColor(w)};color:${dark ? "#fff" : "#2d2a23"}">${w < 0.005 ? "·" : w.toFixed(2)}</td>`;
    }).join("") + "</tr>";
  });
  document.getElementById("attn").innerHTML = html;

  const max = Math.max(...now.O.flat().map(Math.abs), ...ref.O.flat().map(Math.abs));
  let maxDelta = 0;
  html = "<tr><th></th>" + Array.from({ length: D }, (_, k) => `<th>${k}</th>`).join("") + "<th>change vs. original order</th></tr>";
  now.O.forEach((o, i) => {
    const t = order[i];
    const d = dist(o, ref.O[t.id]);
    maxDelta = Math.max(maxDelta, d);
    html += `<tr><th>${label(t)}</th>` + o.map((v) => `<td class="v" title="${v.toFixed(3)}" style="background:${valueColor(v, max)}"></td>`).join("")
      + `<td class="delta ${d < 1e-9 ? "zero" : "nonzero"}">${d.toFixed(3)}</td></tr>`;
  });
  document.getElementById("out").innerHTML = html;

  const thes = order.map((t, i) => [t, i]).filter(([t]) => t.word === "the");
  const theGap = dist(now.O[thes[0][1]], now.O[thes[1][1]]);
  const shuffled = order.some((t, i) => t.id !== i);
  let msg;
  if (!usePE && !causal) {
    msg = shuffled
      ? "Every token's output is <b>exactly</b> what it was in the original sentence; the rows just moved. Attention saw a bag of words."
      : "Shuffle the words: with no positions and no mask, no token's output will change, only its row.";
    msg += ` The two copies of "the" are indistinguishable: their outputs differ by <b>${theGap.toFixed(3)}</b>.`;
  } else if (!shuffled) {
    msg = `Original order. The two copies of "the" now differ by <b>${theGap.toFixed(3)}</b>, because ${usePE ? "they sit at different positions" : "the mask lets them see different prefixes"}. Shuffle to see outputs change.`;
  } else {
    msg = `Outputs changed by up to <b>${maxDelta.toFixed(3)}</b>: ${usePE ? "position is now part of each vector" : "the causal mask decides who sees whom, so order leaks in"}.`;
  }
  document.getElementById("status").innerHTML = msg;
}

document.getElementById("tokens").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const i = Number(chip.dataset.i);
  if (picked === null) picked = i;
  else {
    [order[picked], order[i]] = [order[i], order[picked]];
    picked = null;
  }
  render();
});
document.getElementById("shuffle").addEventListener("click", () => {
  const next = order.slice();
  do {
    for (let i = next.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [next[i], next[j]] = [next[j], next[i]];
    }
  } while (next.every((t, i) => t.id === order[i].id));
  order = next;
  picked = null;
  render();
});
document.getElementById("reset").addEventListener("click", () => { order = original.slice(); picked = null; render(); });
document.getElementById("pe").addEventListener("change", render);
document.getElementById("causal").addEventListener("change", render);
render();
</script>
</body>
</html>
